# http://localhost:PORT/<proyecto>/public  ->  projects/<proyecto>/public
server {
    listen 80 default_server;
    server_name localhost;

    root /var/www/html;
    index index.php index.html;
    client_max_body_size 128M;
    charset utf-8;
    absolute_redirect off;

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # PHP (debe ir antes que el location de proyectos)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    rewrite ^/([^/]+)/public$ /$1/public/ permanent;

    # Cualquier proyecto Laravel: /<proyecto>/public/...
    location ~ ^/(?<project>[^/]+)/public(/.*)?$ {
        try_files $uri $uri/ /$project/public/index.php?$query_string;
    }
}
